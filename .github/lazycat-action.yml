version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/ddia.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
    image: ""

build:
  run_buildscript: true

images: []

stores:
  official:
    # Official store publication is intentionally disabled; publish only to MiaoMiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: 设计数据密集型应用
    summary: DDIA 中文版：数据密集型应用系统设计（第二版）在线书籍
